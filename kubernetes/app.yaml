apiVersion: apps/v1
kind: Deployment
metadata:
  name: ipgeo-api
  namespace: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ipgeo-api
  template:
    metadata:
      labels:
        app: ipgeo-api
    spec:
      containers:
        - name: api
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DB_HOST
              value: postgres-rw.database.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: ipgeo
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: app-db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-db-secret
                  key: password
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ipgeo-api
  namespace: app
  labels:
    app: ipgeo-api
spec:
  selector:
    app: ipgeo-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ipgeo-api
  namespace: app
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: ipgeo-api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
