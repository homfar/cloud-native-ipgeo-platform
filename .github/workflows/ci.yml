name: CI and Container Publish

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ipgeo-api

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate shell scripts
        run: for file in scripts/*.sh; do bash -n "$file"; done

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform
        run: terraform -chdir=terraform init -backend=false

      - name: Check Terraform formatting
        run: terraform -chdir=terraform fmt -check

      - name: Validate Terraform
        run: terraform -chdir=terraform validate

      - name: Validate Grafana dashboard JSON
        run: python3 -m json.tool kubernetes/monitoring/grafana/dashboards/ipgeo-api-overview.json >/dev/null

      - name: Compile Python application
        run: python3 -m py_compile app/main.py

      - name: Build application image
        run: docker build -t ipgeo-api:ci app

  publish:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
